<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Spoider Finds</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0b;
      color: #f0ece3;
      padding: 1.2rem;
    }
    h1 { font-size: 1.4rem; color: #e8c766; margin-bottom: 1rem; }
    h2 { font-size: 1.1rem; color: #e8c766; margin: 2rem 0 0.8rem; }
    h3.subhead { font-size: 0.85rem; color: #cbc4b6; margin: 1.2rem 0 0.4rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .card {
      background: #16161a;
      border: 1px solid rgba(201,168,118,0.25);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    label { display: block; font-size: 0.85rem; margin: 0.7rem 0 0.3rem; color: #cbc4b6; }
    input, select, textarea {
      width: 100%;
      padding: 0.6rem;
      border-radius: 8px;
      border: 1px solid rgba(201,168,118,0.3);
      background: #0a0a0b;
      color: #f0ece3;
      font-size: 0.95rem;
    }
    textarea { min-height: 70px; resize: vertical; }
    button {
      background: #c9a876;
      color: #0a0a0b;
      border: none;
      padding: 0.7rem 1.2rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      margin-top: 1rem;
      cursor: pointer;
      width: 100%;
    }
    button.secondary { background: transparent; border: 1px solid #c9a876; color: #c9a876; }
    button.danger { background: #7a2f2f; color: #fff; }
    .product-row {
      display: flex;
      gap: 0.8rem;
      align-items: center;
      padding: 0.7rem 0;
      border-bottom: 1px solid rgba(201,168,118,0.15);
    }
    .product-row img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }
    .product-info { flex: 1; min-width: 0; }
    .product-info strong { display: block; font-size: 0.9rem; }
    .product-info span { font-size: 0.75rem; color: #999; }
    .product-info .score-chip {
      display: inline-block;
      margin-top: 2px;
      font-size: 0.7rem;
      color: #e8c766;
      border: 1px solid rgba(201,168,118,0.35);
      border-radius: 999px;
      padding: 1px 7px;
    }
    .row-actions { display: flex; gap: 0.4rem; }
    .row-actions button { width: auto; margin: 0; padding: 0.4rem 0.7rem; font-size: 0.8rem; }
    #status { font-size: 0.85rem; margin-top: 0.5rem; min-height: 1.2rem; }
    .hidden { display: none !important; }
    .badge-inactive { color: #ff8080; font-size: 0.7rem; }

    .score-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 0.8rem;
    }
    .score-avg-preview {
      margin-top: 0.8rem;
      font-size: 0.85rem;
      color: #e8c766;
      background: rgba(201,168,118,0.08);
      border: 1px solid rgba(201,168,118,0.25);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
    }
    .score-avg-preview b { font-size: 1.1rem; }

    /* ---------- Tabs (Products / Analytics) ---------- */
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .tabs .tab {
      margin: 0;
      flex: 1;
      background: transparent;
      border: 1px solid rgba(201,168,118,0.4);
      color: #c9a876;
    }
    .tabs .tab.active { background: #c9a876; color: #0a0a0b; }

    /* ---------- Analytics ---------- */
    .an-toolbar { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 1rem; }
    .an-toolbar .range-btn {
      margin: 0;
      flex: 1;
      padding: 0.5rem 0.4rem;
      font-size: 0.82rem;
      background: transparent;
      border: 1px solid rgba(201,168,118,0.3);
      color: #cbc4b6;
    }
    .an-toolbar .range-btn.active { border-color: #e8c766; color: #e8c766; background: rgba(201,168,118,0.12); }
    .an-toolbar .refresh-btn { margin: 0; width: auto; padding: 0.5rem 0.9rem; font-size: 0.82rem; }

    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; margin-bottom: 1rem; }
    .stat-box {
      background: #16161a;
      border: 1px solid rgba(201,168,118,0.25);
      border-radius: 12px;
      padding: 0.9rem 0.4rem;
      text-align: center;
    }
    .stat-box b { display: block; font-size: 1.6rem; color: #e8c766; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .stat-box span { display: block; margin-top: 0.3rem; font-size: 0.7rem; color: #8a8579; text-transform: uppercase; letter-spacing: 0.05em; }

    .an-card-title {
      font-size: 0.8rem;
      color: #cbc4b6;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 0 0 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.5rem;
    }
    .an-card-title small { color: #8a8579; text-transform: none; letter-spacing: 0; font-size: 0.72rem; }

    .chart {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 130px;
      padding-bottom: 2px;
      border-bottom: 1px solid rgba(201,168,118,0.25);
    }
    .chart .bar {
      flex: 1;
      min-width: 1px;
      min-height: 2px;
      background: linear-gradient(180deg, #e8c766, #c9a876);
      border-radius: 2px 2px 0 0;
      opacity: 0.9;
    }
    .chart .bar.zero { background: rgba(201,168,118,0.2); opacity: 1; }
    .chart-axis { display: flex; justify-content: space-between; font-size: 0.7rem; color: #8a8579; margin-top: 0.4rem; }
    .chart-peak { font-size: 0.78rem; color: #cbc4b6; margin-top: 0.6rem; }
    .chart-peak b { color: #e8c766; }

    .rank-row { margin-bottom: 0.8rem; }
    .rank-row:last-child { margin-bottom: 0; }
    .rank-head { display: flex; justify-content: space-between; gap: 0.6rem; font-size: 0.85rem; margin-bottom: 0.3rem; }
    .rank-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rank-count { color: #e8c766; font-weight: 600; font-variant-numeric: tabular-nums; }
    .rank-track { height: 5px; border-radius: 99px; background: rgba(255,255,255,0.08); overflow: hidden; }
    .rank-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #c9a876, #e8c766); }

    .region-bar { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: rgba(255,255,255,0.08); }
    .region-seg-us { background: #c9a876; }
    .region-seg-in { background: #e8c766; }
    .region-seg-unk { background: #6b6968; }
    .region-legend { display: flex; flex-wrap: wrap; gap: 0.4rem 1.2rem; margin-top: 0.7rem; font-size: 0.82rem; color: #cbc4b6; }
    .region-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
    .region-legend b { color: #f0ece3; }

    .an-empty { text-align: center; padding: 2rem 1rem; color: #8a8579; font-size: 0.9rem; line-height: 1.6; }
    .an-error { color: #ff8080; font-size: 0.85rem; line-height: 1.5; }
    .an-note { font-size: 0.72rem; color: #6b6968; margin-top: 0.8rem; }
  </style>
</head>
<body>

  <div id="loginView">
    <h1>Spoider Finds — Admin Login</h1>
    <div class="card">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="you@example.com">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••">
      <button onclick="login()">Log in</button>
      <p id="loginStatus" style="color:#ff8080; font-size:0.85rem;"></p>
    </div>
  </div>

  <div id="adminView" class="hidden">
    <h1>Spoider Finds — Admin</h1>
    <button class="secondary" onclick="logout()" style="margin-bottom:1rem;">Log out</button>

    <div class="tabs">
      <button type="button" class="tab active" id="tabProducts" onclick="switchTab('products')">Products</button>
      <button type="button" class="tab" id="tabAnalytics" onclick="switchTab('analytics')">Analytics</button>
    </div>

    <!-- ===================== PRODUCTS PANEL ===================== -->
    <div id="productsPanel">
      <h2 id="formTitle" style="margin-top:0.5rem;">Add Product</h2>
      <div class="card">
        <input type="hidden" id="editId">
        <label>Title</label>
        <input type="text" id="pTitle" placeholder="Product name">
        <label>Description</label>
        <textarea id="pDescription" placeholder="Short description"></textarea>
        <label>Affiliate Link</label>
        <input type="text" id="pLink" placeholder="https://www.amazon.in/...">
        <label>Category</label>
        <select id="pCategory">
          <option value="desk-setup">Desk Setup</option>
          <option value="fashion-finds">Fashion Finds</option>
          <option value="accessories">Accessories</option>
          <option value="amazon-finds">Amazon Finds</option>
        </select>
        <label>Region</label>
        <select id="pRegion">
          <option value="india">India</option>
          <option value="us">US</option>
        </select>
        <label>Product Image</label>
        <input type="file" id="pImageFile" accept="image/*">
        <input type="hidden" id="pImageUrl">
        <img id="imagePreview" class="hidden" style="width:80px;height:80px;object-fit:cover;border-radius:8px;margin-top:0.5rem;">
        <label style="display:flex; align-items:center; gap:0.5rem; margin-top:0.8rem;">
          <input type="checkbox" id="pActive" checked style="width:auto;"> Active (visible on site)
        </label>

        <h3 class="subhead">Spoider Score</h3>
        <p style="font-size:0.78rem; color:#8a8579; margin:-0.2rem 0 0.6rem;">Leave all four blank to skip the score badge on this product entirely.</p>
        <div class="score-grid">
          <div>
            <label>Design (0–10)</label>
            <input type="number" id="sDesign" min="0" max="10" step="0.1" placeholder="e.g. 9.0">
          </div>
          <div>
            <label>Value (0–10)</label>
            <input type="number" id="sValue" min="0" max="10" step="0.1" placeholder="e.g. 8.0">
          </div>
          <div>
            <label>Usefulness (0–10)</label>
            <input type="number" id="sUsefulness" min="0" max="10" step="0.1" placeholder="e.g. 8.8">
          </div>
          <div>
            <label>Aesthetic (0–10)</label>
            <input type="number" id="sAesthetic" min="0" max="10" step="0.1" placeholder="e.g. 9.6">
          </div>
        </div>
        <div class="score-avg-preview">Spoider Score: <b id="scoreAvgPreview">—</b></div>

        <label>Editor Note ("Why we chose this")</label>
        <textarea id="pEditorNote" placeholder="1-2 sentences on the specific reason this made the cut."></textarea>

        <button onclick="saveProduct()">Save Product</button>
        <button class="secondary" id="cancelEditBtn" onclick="resetForm()" style="display:none;">Cancel Edit</button>
        <p id="status"></p>
      </div>

      <h2>All Products</h2>
      <div class="card">
        <div id="productList">Loading...</div>
      </div>
    </div>

    <!-- ===================== ANALYTICS PANEL ===================== -->
    <div id="analyticsPanel" class="hidden">
      <div class="an-toolbar">
        <button type="button" class="range-btn" data-range="7" onclick="setAnalyticsRange(7)">7 din</button>
        <button type="button" class="range-btn active" data-range="30" onclick="setAnalyticsRange(30)">30 din</button>
        <button type="button" class="range-btn" data-range="90" onclick="setAnalyticsRange(90)">90 din</button>
        <button type="button" class="secondary refresh-btn" onclick="loadAnalytics()">↻</button>
      </div>
      <div id="analyticsBody"><div class="card an-empty">Loading...</div></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gqnwinkddckytrfpnhng.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_NYb3HMwKyHL1YxlOIWtcQg_NGJwDwmQ';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;

    async function checkSession() {
      const { data } = await sb.auth.getSession();
      if (data.session) {
        currentUser = data.session.user;
        showAdmin();
      } else {
        showLogin();
      }
    }

    function showLogin() {
      document.getElementById('loginView').classList.remove('hidden');
      document.getElementById('adminView').classList.add('hidden');
    }

    function showAdmin() {
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('adminView').classList.remove('hidden');
      switchTab('products');
      loadProducts();
    }

    async function login() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const statusEl = document.getElementById('loginStatus');
      statusEl.textContent = 'Logging in...';
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        statusEl.textContent = error.message;
        return;
      }
      currentUser = data.user;
      showAdmin();
    }

    async function logout() {
      await sb.auth.signOut();
      showLogin();
    }

    // ---- Tabs ----
    function switchTab(name) {
      const isAnalytics = name === 'analytics';
      document.getElementById('productsPanel').classList.toggle('hidden', isAnalytics);
      document.getElementById('analyticsPanel').classList.toggle('hidden', !isAnalytics);
      document.getElementById('tabProducts').classList.toggle('active', !isAnalytics);
      document.getElementById('tabAnalytics').classList.toggle('active', isAnalytics);
      if (isAnalytics) loadAnalytics();
    }

    // ---- Spoider Score: live average preview as the four fields are edited ----
    function currentScoreInputs() {
      return {
        design: document.getElementById('sDesign').value,
        value: document.getElementById('sValue').value,
        usefulness: document.getElementById('sUsefulness').value,
        aesthetic: document.getElementById('sAesthetic').value
      };
    }

    function updateScoreAvgPreview() {
      const s = currentScoreInputs();
      const vals = [s.design, s.value, s.usefulness, s.aesthetic];
      const filled = vals.filter(function (v) { return v !== '' && v !== null; });
      const previewEl = document.getElementById('scoreAvgPreview');
      if (filled.length === 0) {
        previewEl.textContent = '— (no score, badge will be hidden)';
        return;
      }
      const nums = filled.map(Number);
      const avg = nums.reduce(function (a, b) { return a + b; }, 0) / nums.length;
      previewEl.textContent = avg.toFixed(1) + (filled.length < 4 ? ' (only ' + filled.length + '/4 filled)' : '');
    }

    ['sDesign', 'sValue', 'sUsefulness', 'sAesthetic'].forEach(function (id) {
      document.getElementById(id).addEventListener('input', updateScoreAvgPreview);
    });

    function resetForm() {
      document.getElementById('editId').value = '';
      document.getElementById('pTitle').value = '';
      document.getElementById('pDescription').value = '';
      document.getElementById('pLink').value = '';
      document.getElementById('pCategory').value = 'desk-setup';
      document.getElementById('pRegion').value = 'india';
      document.getElementById('pImageFile').value = '';
      document.getElementById('pImageUrl').value = '';
      document.getElementById('pActive').checked = true;
      document.getElementById('imagePreview').classList.add('hidden');
      document.getElementById('sDesign').value = '';
      document.getElementById('sValue').value = '';
      document.getElementById('sUsefulness').value = '';
      document.getElementById('sAesthetic').value = '';
      document.getElementById('pEditorNote').value = '';
      updateScoreAvgPreview();
      document.getElementById('formTitle').textContent = 'Add Product';
      document.getElementById('cancelEditBtn').style.display = 'none';
      document.getElementById('status').textContent = '';
    }

    async function saveProduct() {
      const statusEl = document.getElementById('status');
      const editId = document.getElementById('editId').value;
      const title = document.getElementById('pTitle').value.trim();
      const description = document.getElementById('pDescription').value.trim();
      const affiliate_link = document.getElementById('pLink').value.trim();
      const category = document.getElementById('pCategory').value;
      const region = document.getElementById('pRegion').value;
      const active = document.getElementById('pActive').checked;
      const fileInput = document.getElementById('pImageFile');
      let image_url = document.getElementById('pImageUrl').value;

      if (!title || !affiliate_link) {
        statusEl.textContent = 'Title and affiliate link are required.';
        return;
      }

      statusEl.textContent = 'Saving...';

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const fileName = Date.now() + '-' + file.name.replace(/[^a-zA-Z0-9.]/g, '');
        const { data: uploadData, error: uploadError } = await sb.storage
          .from('product-images')
          .upload(fileName, file);
        if (uploadError) {
          statusEl.textContent = 'Image upload failed: ' + uploadError.message;
          return;
        }
        const { data: urlData } = sb.storage.from('product-images').getPublicUrl(fileName);
        image_url = urlData.publicUrl;
      }

      // Spoider Score: only saved if ALL four sub-scores are filled.
      // A partial score (e.g. 2 of 4 fields) is treated the same as no
      // score at all, rather than silently averaging an incomplete set —
      // otherwise a half-filled form could publish a misleading number.
      const s = currentScoreInputs();
      const rawVals = [s.design, s.value, s.usefulness, s.aesthetic];
      const allFilled = rawVals.every(function (v) { return v !== '' && v !== null; });
      let score_design = null, score_value = null, score_usefulness = null, score_aesthetic = null, spoider_score = null;
      if (allFilled) {
        score_design = Number(s.design);
        score_value = Number(s.value);
        score_usefulness = Number(s.usefulness);
        score_aesthetic = Number(s.aesthetic);
        spoider_score = Math.round(((score_design + score_value + score_usefulness + score_aesthetic) / 4) * 10) / 10;
      }
      const editor_note = document.getElementById('pEditorNote').value.trim() || null;

      const payload = {
        title, description, affiliate_link, category, region, active, image_url,
        score_design, score_value, score_usefulness, score_aesthetic, spoider_score, editor_note
      };

      let result;
      if (editId) {
        result = await sb.from('products').update(payload).eq('id', editId);
      } else {
        result = await sb.from('products').insert(payload);
      }

      if (result.error) {
        statusEl.textContent = 'Error: ' + result.error.message;
        return;
      }

      statusEl.textContent = 'Saved successfully!';
      resetForm();
      loadProducts();
    }

    async function loadProducts() {
      const listEl = document.getElementById('productList');
      listEl.textContent = 'Loading...';
      const { data, error } = await sb.from('products').select('*').order('created_at', { ascending: false });
      if (error) {
        listEl.textContent = 'Error loading products: ' + error.message;
        return;
      }
      if (!data.length) {
        listEl.textContent = 'No products yet.';
        return;
      }
      listEl.innerHTML = '';
      data.forEach(p => {
        const row = document.createElement('div');
        row.className = 'product-row';
        const scoreChip = (p.spoider_score !== null && p.spoider_score !== undefined)
          ? '<span class="score-chip">★ ' + Number(p.spoider_score).toFixed(1) + '</span>'
          : '';
        row.innerHTML = `
          <img src="${p.image_url || ''}" onerror="this.style.display='none'">
          <div class="product-info">
            <strong>${p.title} ${!p.active ? '<span class=\"badge-inactive\">(hidden)</span>' : ''}</strong>
            <span>${p.category} · ${p.region}</span><br>
            ${scoreChip}
          </div>
          <div class="row-actions">
            <button class="secondary" onclick='editProduct(${JSON.stringify(p).replace(/'/g, "&#39;")})'>Edit</button>
            <button class="danger" onclick="deleteProduct(${p.id})">Del</button>
          </div>
        `;
        listEl.appendChild(row);
      });
    }

    function editProduct(p) {
      document.getElementById('editId').value = p.id;
      document.getElementById('pTitle').value = p.title || '';
      document.getElementById('pDescription').value = p.description || '';
      document.getElementById('pLink').value = p.affiliate_link || '';
      document.getElementById('pCategory').value = p.category || 'desk-setup';
      document.getElementById('pRegion').value = p.region || 'india';
      document.getElementById('pImageUrl').value = p.image_url || '';
      document.getElementById('pActive').checked = p.active;
      document.getElementById('sDesign').value = (p.score_design !== null && p.score_design !== undefined) ? p.score_design : '';
      document.getElementById('sValue').value = (p.score_value !== null && p.score_value !== undefined) ? p.score_value : '';
      document.getElementById('sUsefulness').value = (p.score_usefulness !== null && p.score_usefulness !== undefined) ? p.score_usefulness : '';
      document.getElementById('sAesthetic').value = (p.score_aesthetic !== null && p.score_aesthetic !== undefined) ? p.score_aesthetic : '';
      document.getElementById('pEditorNote').value = p.editor_note || '';
      updateScoreAvgPreview();
      const preview = document.getElementById('imagePreview');
      if (p.image_url) {
        preview.src = p.image_url;
        preview.classList.remove('hidden');
      } else {
        preview.classList.add('hidden');
      }
      document.getElementById('formTitle').textContent = 'Edit Product';
      document.getElementById('cancelEditBtn').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteProduct(id) {
      if (!confirm('Delete this product?')) return;
      const { error } = await sb.from('products').delete().eq('id', id);
      if (error) {
        alert('Error: ' + error.message);
        return;
      }
      loadProducts();
    }

    // =========================================================
    // ANALYTICS — affiliate click dashboard
    //
    // Data comes from the click_stats(days) Postgres function
    // (see the SQL you ran in Supabase), which returns one JSON
    // object: { total, today, by_region, top_products, top_pages,
    // daily }. Days are counted in IST.
    //
    // SECURITY: the clicks table accepts inserts from anyone (anon),
    // so product_title / page text is untrusted input. Everything
    // rendered from it goes through esc() before touching innerHTML.
    // =========================================================
    let analyticsRange = 30;
    let analyticsToken = 0;

    function esc(value) {
      return String(value === null || value === undefined ? '' : value).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function fmt(n) {
      return Number(n || 0).toLocaleString('en-IN');
    }

    // Today's date in IST as YYYY-MM-DD
    function istToday() {
      return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
    }

    // Last n IST calendar days, oldest → newest, as YYYY-MM-DD keys
    function lastDays(n) {
      const parts = istToday().split('-').map(Number);
      const base = Date.UTC(parts[0], parts[1] - 1, parts[2]);
      const out = [];
      for (let i = n - 1; i >= 0; i--) {
        out.push(new Date(base - i * 86400000).toISOString().slice(0, 10));
      }
      return out;
    }

    function dayLabel(key) {
      return new Date(key + 'T00:00:00Z').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', timeZone: 'UTC' });
    }

    function sumLastDays(daily, n) {
      const wanted = {};
      lastDays(n).forEach(function (k) { wanted[k] = true; });
      return (daily || []).reduce(function (sum, d) {
        return wanted[d.day] ? sum + Number(d.clicks || 0) : sum;
      }, 0);
    }

    function prettyPage(path) {
      const seg = String(path || '').split('/').filter(Boolean).pop() || 'home';
      const name = seg.replace(/\.html$/i, '');
      return (!name || name === 'index') ? 'home' : name;
    }

    function setAnalyticsRange(days) {
      analyticsRange = days;
      document.querySelectorAll('.an-toolbar .range-btn').forEach(function (b) {
        b.classList.toggle('active', Number(b.getAttribute('data-range')) === days);
      });
      loadAnalytics();
    }

    async function loadAnalytics() {
      const body = document.getElementById('analyticsBody');
      const token = ++analyticsToken;
      body.innerHTML = '<div class="card an-empty">Loading...</div>';

      try {
        // Cards (today / 7d / 30d) always need the 90-day daily series;
        // the rest of the page uses the selected range. If the selected
        // range IS 90, both are the same call.
        const widePromise = sb.rpc('click_stats', { days: 90 });
        const rangePromise = analyticsRange === 90 ? widePromise : sb.rpc('click_stats', { days: analyticsRange });
        const results = await Promise.all([widePromise, rangePromise]);
        if (token !== analyticsToken) return; // a newer request already took over

        const wide = results[0], sel = results[1];
        if (wide.error) throw wide.error;
        if (sel.error) throw sel.error;
        renderAnalytics(wide.data, sel.data);
      } catch (err) {
        if (token !== analyticsToken) return;
        body.innerHTML =
          '<div class="card"><p class="an-error">Analytics load nahi ho paaye: ' + esc(err && err.message ? err.message : err) + '</p>' +
          '<p class="an-note">Check kar: (1) click_stats function aur SELECT policy wala SQL run hua ya nahi, (2) tu logged in hai ya nahi.</p></div>';
      }
    }

    function renderAnalytics(wide, sel) {
      const body = document.getElementById('analyticsBody');
      wide = wide || {};
      sel = sel || {};

      if (!Number(wide.total)) {
        body.innerHTML =
          '<div class="card an-empty">Abhi koi clicks record nahi hue.<br>' +
          'Site pe kisi product card pe tap kar ke test kar, phir ↻ dabao.</div>';
        return;
      }

      const daily = wide.daily || [];
      const cards =
        '<div class="stat-grid">' +
          '<div class="stat-box"><b>' + fmt(wide.today) + '</b><span>Aaj</span></div>' +
          '<div class="stat-box"><b>' + fmt(sumLastDays(daily, 7)) + '</b><span>7 din</span></div>' +
          '<div class="stat-box"><b>' + fmt(sumLastDays(daily, 30)) + '</b><span>30 din</span></div>' +
        '</div>';

      // ---- Daily chart for the selected range ----
      const keys = lastDays(analyticsRange);
      const byDay = {};
      (sel.daily || []).forEach(function (d) { byDay[d.day] = Number(d.clicks || 0); });
      const vals = keys.map(function (k) { return byDay[k] || 0; });
      const max = Math.max.apply(null, vals.concat([1]));
      let peakIdx = 0;
      vals.forEach(function (v, i) { if (v > vals[peakIdx]) peakIdx = i; });
      const bars = vals.map(function (v, i) {
        const h = v === 0 ? 2 : Math.max(4, Math.round((v / max) * 100));
        return '<div class="bar' + (v === 0 ? ' zero' : '') + '" style="height:' + h + '%" title="' + esc(dayLabel(keys[i])) + ': ' + v + '"></div>';
      }).join('');
      const chart =
        '<div class="card">' +
          '<p class="an-card-title">Daily clicks <small>last ' + analyticsRange + ' din</small></p>' +
          '<div class="chart">' + bars + '</div>' +
          '<div class="chart-axis"><span>' + esc(dayLabel(keys[0])) + '</span><span>' + esc(dayLabel(keys[keys.length - 1])) + '</span></div>' +
          '<p class="chart-peak">Best din: <b>' + esc(dayLabel(keys[peakIdx])) + '</b> (' + fmt(vals[peakIdx]) + ' clicks) · Total: <b>' + fmt(sel.total) + '</b></p>' +
        '</div>';

      // ---- Top products ----
      const top = sel.top_products || [];
      const topMax = top.length ? Number(top[0].clicks) || 1 : 1;
      const topHtml = top.length
        ? top.map(function (p) {
            const pct = Math.max(3, Math.round((Number(p.clicks) / topMax) * 100));
            return '<div class="rank-row"><div class="rank-head"><span class="rank-title">' + esc(p.title) + '</span><span class="rank-count">' + fmt(p.clicks) + '</span></div>' +
                   '<div class="rank-track"><div class="rank-fill" style="width:' + pct + '%"></div></div></div>';
          }).join('')
        : '<p class="an-note">Is range mein koi data nahi.</p>';
      const topCard =
        '<div class="card"><p class="an-card-title">Top products <small>title ke hisaab se</small></p>' + topHtml + '</div>';

      // ---- Region split ----
      const reg = sel.by_region || {};
      const us = Number(reg.us || 0), ind = Number(reg['in'] || 0), unk = Number(reg.unknown || 0);
      const regTotal = us + ind + unk;
      const pctOf = function (n) { return regTotal ? (n / regTotal) * 100 : 0; };
      const regionCard =
        '<div class="card"><p class="an-card-title">US vs India</p>' +
          '<div class="region-bar">' +
            '<div class="region-seg-us" style="width:' + pctOf(us).toFixed(1) + '%"></div>' +
            '<div class="region-seg-in" style="width:' + pctOf(ind).toFixed(1) + '%"></div>' +
            '<div class="region-seg-unk" style="width:' + pctOf(unk).toFixed(1) + '%"></div>' +
          '</div>' +
          '<div class="region-legend">' +
            '<span><i style="background:#c9a876"></i>US <b>' + fmt(us) + '</b> (' + Math.round(pctOf(us)) + '%)</span>' +
            '<span><i style="background:#e8c766"></i>India <b>' + fmt(ind) + '</b> (' + Math.round(pctOf(ind)) + '%)</span>' +
            (unk ? '<span><i style="background:#6b6968"></i>Unknown <b>' + fmt(unk) + '</b></span>' : '') +
          '</div>' +
          '<p class="an-note">Home page (index) ke clicks US mein count hote hain.</p>' +
        '</div>';

      // ---- Top pages ----
      const pages = sel.top_pages || [];
      const pageMax = pages.length ? Number(pages[0].clicks) || 1 : 1;
      const pagesHtml = pages.length
        ? pages.map(function (p) {
            const pct = Math.max(3, Math.round((Number(p.clicks) / pageMax) * 100));
            return '<div class="rank-row"><div class="rank-head"><span class="rank-title">' + esc(prettyPage(p.page)) + '</span><span class="rank-count">' + fmt(p.clicks) + '</span></div>' +
                   '<div class="rank-track"><div class="rank-fill" style="width:' + pct + '%"></div></div></div>';
          }).join('')
        : '<p class="an-note">Is range mein koi data nahi.</p>';
      const pagesCard =
        '<div class="card"><p class="an-card-title">Top pages <small>kahan se clicks aaye</small></p>' + pagesHtml + '</div>';

      body.innerHTML = cards + chart + topCard + regionCard + pagesCard +
        '<p class="an-note">Yeh clicks Spoider Finds site ke product cards ke hain, Amazon ke actual sales/earnings nahi. Asli earnings ke liye Amazon Associates dashboard dekh.</p>';
    }

    checkSession();
  </script>
</body>
</html>
