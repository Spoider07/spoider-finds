<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Spoider Finds</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0a0a0b;
      --panel: #131316;
      --panel-2: #18181c;
      --line: rgba(201,168,118,0.22);
      --line-soft: rgba(255,255,255,0.07);
      --gold: #c9a876;
      --gold-bright: #e8c766;
      --text: #f0ece3;
      --text-2: #cbc4b6;
      --muted: #8a8579;
      --danger: #b4443f;
      --ok: #62c58a;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; font-weight: 500; margin: 0; }
    .hidden { display: none !important; }

    /* ---------- shell ---------- */
    .topbar {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: 0.7rem;
      padding: 0.75rem 1rem;
      background: rgba(10,10,11,0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line-soft);
    }
    .brand { font-family: 'Fraunces', Georgia, serif; font-size: 1.15rem; flex: 1; min-width: 0; }
    .brand b { font-weight: 500; color: var(--gold); }
    .brand small { color: var(--muted); font-family: 'Inter', sans-serif; font-size: 0.72rem; margin-left: 0.4rem; }
    .live-pill {
      display: inline-flex; align-items: center; gap: 0.45rem;
      padding: 0.35rem 0.7rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 0.78rem; color: var(--text-2);
      background: var(--panel);
      font-variant-numeric: tabular-nums;
    }
    .live-pill b { color: var(--gold-bright); font-weight: 600; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
    .dot.on { background: var(--ok); box-shadow: 0 0 0 0 rgba(98,197,138,0.6); animation: pulse 2s infinite; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(98,197,138,0.55); }
      70% { box-shadow: 0 0 0 8px rgba(98,197,138,0); }
      100% { box-shadow: 0 0 0 0 rgba(98,197,138,0); }
    }
    @media (prefers-reduced-motion: reduce) { .dot.on { animation: none; } }

    .wrap { max-width: 1040px; margin: 0 auto; padding: 1rem; }
    .tabs { display: flex; gap: 0.4rem; padding: 0.3rem; background: var(--panel); border: 1px solid var(--line-soft); border-radius: 12px; margin-bottom: 1.1rem; }
    .tab {
      flex: 1; margin: 0; padding: 0.6rem 0.5rem;
      background: transparent; border: 0; border-radius: 9px;
      color: var(--text-2); font: 500 0.9rem 'Inter', sans-serif; cursor: pointer;
    }
    .tab.active { background: var(--gold); color: #0a0a0b; }

    /* ---------- cards / forms ---------- */
    .card { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 14px; padding: 1rem; margin-bottom: 0.9rem; }
    .card-title { font-size: 0.74rem; color: var(--muted); text-transform: none; letter-spacing: 0.02em; margin: 0 0 0.8rem; display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; }
    .card-title small { font-size: 0.72rem; color: var(--muted); }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 1.4rem 0 0.7rem; gap: 0.6rem; }
    .section-head h2 { font-size: 1.1rem; color: var(--gold-bright); }
    .section-head span { font-size: 0.75rem; color: var(--muted); }

    label { display: block; font-size: 0.8rem; margin: 0.8rem 0 0.3rem; color: var(--text-2); }
    input, select, textarea {
      width: 100%; padding: 0.65rem 0.7rem;
      border-radius: 10px; border: 1px solid var(--line);
      background: var(--bg); color: var(--text);
      font: 400 0.95rem 'Inter', sans-serif;
    }
    input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 1px; }
    textarea { min-height: 76px; resize: vertical; }
    input[type="checkbox"] { width: auto; accent-color: var(--gold); }
    input[type="file"] { padding: 0.5rem; }

    button {
      background: var(--gold); color: #0a0a0b; border: 0;
      padding: 0.75rem 1.1rem; border-radius: 10px;
      font: 600 0.92rem 'Inter', sans-serif;
      margin-top: 0.9rem; cursor: pointer; width: 100%;
    }
    button:disabled { opacity: 0.55; cursor: progress; }
    button.secondary { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
    button.danger { background: var(--danger); color: #fff; }
    button.ghost { background: transparent; color: var(--text-2); border: 1px solid var(--line-soft); }

    #status, #loginStatus { font-size: 0.84rem; margin: 0.6rem 0 0; min-height: 1.1rem; }
    .msg-ok { color: var(--ok); }
    .msg-err { color: #ff8a80; }

    /* ---------- login ---------- */
    .login-shell { min-height: 100vh; display: grid; place-items: center; padding: 1.2rem; }
    .login-card { width: 100%; max-width: 380px; }
    .login-card h1 { font-size: 1.6rem; margin-bottom: 0.3rem; }
    .login-card h1 b { color: var(--gold); font-weight: 500; }
    .login-card p.sub { color: var(--muted); font-size: 0.85rem; margin: 0 0 0.6rem; }
    .pw-row { position: relative; }
    .pw-row input { padding-right: 4.2rem; }
    .pw-toggle { position: absolute; right: 0.35rem; top: 50%; transform: translateY(-50%); margin: 0; width: auto; padding: 0.35rem 0.6rem; font-size: 0.75rem; }

    /* ---------- products ---------- */
    .products-layout { display: block; }
    @media (min-width: 900px) {
      .products-layout { display: grid; grid-template-columns: 380px 1fr; gap: 1.1rem; align-items: start; }
      .products-layout .form-col { position: sticky; top: 4.2rem; max-height: calc(100vh - 5.2rem); overflow: auto; }
    }
    .score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 0.8rem; }
    .score-avg-preview { margin-top: 0.8rem; font-size: 0.84rem; color: var(--gold-bright); background: rgba(201,168,118,0.08); border: 1px solid var(--line); border-radius: 10px; padding: 0.6rem 0.8rem; }
    .score-avg-preview b { font-size: 1.1rem; }
    .subhead { font-size: 0.8rem; color: var(--text-2); margin: 1.2rem 0 0.3rem; font-family: 'Inter', sans-serif; font-weight: 600; }

    .filters { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.8rem; }
    .filters input { flex: 1 1 100%; }
    .chip {
      margin: 0; width: auto; padding: 0.38rem 0.75rem;
      font: 500 0.78rem 'Inter', sans-serif;
      background: transparent; color: var(--text-2);
      border: 1px solid var(--line-soft); border-radius: 999px;
    }
    .chip.active { border-color: var(--gold-bright); color: var(--gold-bright); background: rgba(201,168,118,0.12); }

    .product-row { display: flex; gap: 0.8rem; align-items: center; padding: 0.75rem 0; border-bottom: 1px solid var(--line-soft); }
    .product-row:last-child { border-bottom: 0; }
    .product-row img { width: 52px; height: 52px; object-fit: cover; border-radius: 8px; background: var(--panel-2); flex: none; }
    .product-info { flex: 1; min-width: 0; }
    .product-info strong { display: block; font-size: 0.9rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .product-info span { font-size: 0.75rem; color: var(--muted); }
    .badge-hidden { color: #ff8a80; font-size: 0.7rem; margin-left: 0.3rem; }
    .score-chip { display: inline-block; margin-left: 0.4rem; font-size: 0.7rem; color: var(--gold-bright); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; }
    .row-actions { display: flex; gap: 0.4rem; flex: none; }
    .row-actions button { width: auto; margin: 0; padding: 0.4rem 0.75rem; font-size: 0.8rem; }

    /* ---------- analytics ---------- */
    .an-toolbar { display: flex; gap: 0.4rem; align-items: center; margin-bottom: 1rem; }
    .range-btn { margin: 0; flex: 1; padding: 0.5rem 0.4rem; font: 500 0.82rem 'Inter', sans-serif; background: transparent; border: 1px solid var(--line-soft); color: var(--text-2); }
    .range-btn.active { border-color: var(--gold-bright); color: var(--gold-bright); background: rgba(201,168,118,0.12); }
    .refresh-btn { margin: 0; width: auto; padding: 0.5rem 0.9rem; font-size: 0.85rem; }

    .live-card { display: flex; gap: 1rem; align-items: center; border-color: var(--line); background: linear-gradient(160deg, #17150f, var(--panel)); }
    .live-num { font-family: 'Fraunces', Georgia, serif; font-size: 3.2rem; line-height: 1; color: var(--gold-bright); font-variant-numeric: tabular-nums; min-width: 2.2ch; }
    .live-meta { flex: 1; min-width: 0; }
    .live-meta .lbl { display: flex; align-items: center; gap: 0.45rem; font-size: 0.85rem; color: var(--text); }
    .live-pages { margin-top: 0.4rem; font-size: 0.78rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0.3rem 0.8rem; }
    .live-pages b { color: var(--text-2); font-weight: 500; }

    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.6rem; margin-bottom: 0.9rem; }
    .stat-grid.three { grid-template-columns: repeat(3, 1fr); }
    @media (min-width: 700px) { .stat-grid { grid-template-columns: repeat(4, 1fr); } .stat-grid.three { grid-template-columns: repeat(3, 1fr); } }
    .stat-box { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 14px; padding: 0.9rem 0.5rem; text-align: center; }
    .stat-box b { display: block; font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: 1.7rem; color: var(--gold-bright); line-height: 1.1; font-variant-numeric: tabular-nums; }
    .stat-box span { display: block; margin-top: 0.3rem; font-size: 0.72rem; color: var(--muted); }

    .chart { display: flex; align-items: flex-end; gap: 2px; height: 130px; padding-bottom: 2px; border-bottom: 1px solid var(--line); }
    .chart .bar { flex: 1; min-width: 1px; min-height: 2px; background: linear-gradient(180deg, var(--gold-bright), var(--gold)); border-radius: 2px 2px 0 0; opacity: 0.92; }
    .chart .bar.zero { background: rgba(201,168,118,0.2); opacity: 1; }
    .chart-axis { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--muted); margin-top: 0.4rem; }
    .chart-peak { font-size: 0.78rem; color: var(--text-2); margin: 0.6rem 0 0; }
    .chart-peak b { color: var(--gold-bright); font-weight: 600; }

    .rank-row { margin-bottom: 0.8rem; }
    .rank-row:last-child { margin-bottom: 0; }
    .rank-head { display: flex; justify-content: space-between; gap: 0.6rem; font-size: 0.85rem; margin-bottom: 0.3rem; }
    .rank-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rank-count { color: var(--gold-bright); font-weight: 600; font-variant-numeric: tabular-nums; }
    .rank-track { height: 5px; border-radius: 99px; background: rgba(255,255,255,0.08); overflow: hidden; }
    .rank-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--gold), var(--gold-bright)); }

    .region-bar { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: rgba(255,255,255,0.08); }
    .region-seg-us { background: var(--gold); }
    .region-seg-in { background: var(--gold-bright); }
    .region-seg-unk { background: #6b6968; }
    .region-legend { display: flex; flex-wrap: wrap; gap: 0.4rem 1.2rem; margin-top: 0.7rem; font-size: 0.82rem; color: var(--text-2); }
    .region-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
    .region-legend b { color: var(--text); }

    .user-row { display: flex; justify-content: space-between; gap: 0.6rem; padding: 0.55rem 0; border-bottom: 1px solid var(--line-soft); font-size: 0.85rem; }
    .user-row:last-child { border-bottom: 0; }
    .user-row span:last-child { color: var(--muted); font-size: 0.75rem; white-space: nowrap; }

    .an-empty { text-align: center; padding: 2rem 1rem; color: var(--muted); font-size: 0.9rem; line-height: 1.6; }
    .an-error { color: #ff8a80; font-size: 0.85rem; line-height: 1.5; margin: 0; }
    .an-note { font-size: 0.72rem; color: #6b6968; margin: 0.8rem 0 0; }
  </style>
</head>
<body>

  <!-- ===================== LOGIN ===================== -->
  <div id="loginView" class="login-shell">
    <div class="card login-card">
      <h1>Spoider<b>Finds</b></h1>
      <p class="sub">Admin login</p>
      <form id="loginForm" autocomplete="on">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" name="email" autocomplete="username" inputmode="email" placeholder="you@example.com" required>
        <label for="loginPassword">Password</label>
        <div class="pw-row">
          <input type="password" id="loginPassword" name="password" autocomplete="current-password" placeholder="••••••••" required>
          <button type="button" class="ghost pw-toggle" id="pwToggle">Show</button>
        </div>
        <button type="submit" id="loginBtn">Log in</button>
        <p id="loginStatus" role="status"></p>
      </form>
    </div>
  </div>

  <!-- ===================== ADMIN ===================== -->
  <div id="adminView" class="hidden">
    <header class="topbar">
      <div class="brand">Spoider<b>Finds</b><small>Admin</small></div>
      <span class="live-pill" title="Abhi site pe kitne log hain"><span class="dot" id="liveDotTop"></span><b id="liveNumTop">–</b> live</span>
      <button type="button" class="secondary" id="logoutBtn" style="margin:0;width:auto;padding:0.4rem 0.8rem;font-size:0.8rem;">Log out</button>
    </header>

    <div class="wrap">
      <div class="tabs" role="tablist">
        <button type="button" class="tab active" id="tabProducts" role="tab">Products</button>
        <button type="button" class="tab" id="tabAnalytics" role="tab">Analytics</button>
      </div>

      <!-- ============ PRODUCTS PANEL ============ -->
      <div id="productsPanel">
        <div class="products-layout">
          <div class="form-col">
            <div class="card">
              <h2 id="formTitle" style="font-size:1.1rem;color:var(--gold-bright);">Add Product</h2>
              <input type="hidden" id="editId">
              <label for="pTitle">Title</label>
              <input type="text" id="pTitle" placeholder="Product name">
              <label for="pDescription">Description</label>
              <textarea id="pDescription" placeholder="Short description"></textarea>
              <label for="pLink">Affiliate Link</label>
              <input type="text" id="pLink" placeholder="https://www.amazon.in/..." inputmode="url">
              <label for="pCategory">Category</label>
              <select id="pCategory">
                <option value="desk-setup">Desk Setup</option>
                <option value="fashion-finds">Fashion Finds</option>
                <option value="accessories">Accessories</option>
                <option value="amazon-finds">Amazon Finds</option>
              </select>
              <label for="pRegion">Region</label>
              <select id="pRegion">
                <option value="india">India</option>
                <option value="us">US</option>
              </select>
              <label for="pImageFile">Product Image</label>
              <input type="file" id="pImageFile" accept="image/*">
              <input type="hidden" id="pImageUrl">
              <img id="imagePreview" class="hidden" alt="" style="width:80px;height:80px;object-fit:cover;border-radius:10px;margin-top:0.6rem;">
              <label style="display:flex; align-items:center; gap:0.5rem; margin-top:0.9rem;">
                <input type="checkbox" id="pActive" checked> Active (visible on site)
              </label>

              <h3 class="subhead">Spoider Score</h3>
              <p style="font-size:0.78rem; color:var(--muted); margin:0 0 0.5rem;">Chaaron khaali chhod do to is product pe score badge nahi dikhega.</p>
              <div class="score-grid">
                <div><label for="sDesign">Design (0–10)</label><input type="number" id="sDesign" min="0" max="10" step="0.1" placeholder="e.g. 9.0" inputmode="decimal"></div>
                <div><label for="sValue">Value (0–10)</label><input type="number" id="sValue" min="0" max="10" step="0.1" placeholder="e.g. 8.0" inputmode="decimal"></div>
                <div><label for="sUsefulness">Usefulness (0–10)</label><input type="number" id="sUsefulness" min="0" max="10" step="0.1" placeholder="e.g. 8.8" inputmode="decimal"></div>
                <div><label for="sAesthetic">Aesthetic (0–10)</label><input type="number" id="sAesthetic" min="0" max="10" step="0.1" placeholder="e.g. 9.6" inputmode="decimal"></div>
              </div>
              <div class="score-avg-preview">Spoider Score: <b id="scoreAvgPreview">—</b></div>

              <label for="pEditorNote">Editor Note ("Why we chose this")</label>
              <textarea id="pEditorNote" placeholder="1-2 sentences on the specific reason this made the cut."></textarea>

              <button type="button" id="saveBtn">Save Product</button>
              <button type="button" class="secondary" id="cancelEditBtn" style="display:none;">Cancel Edit</button>
              <p id="status" role="status"></p>
            </div>
          </div>

          <div class="list-col">
            <div class="section-head" style="margin-top:0;"><h2>All Products</h2><span id="productCount"></span></div>
            <div class="card">
              <div class="filters">
                <input type="search" id="pSearch" placeholder="Search title…">
                <button type="button" class="chip active" data-f="all">All</button>
                <button type="button" class="chip" data-f="india">India</button>
                <button type="button" class="chip" data-f="us">US</button>
                <button type="button" class="chip" data-f="hidden">Hidden</button>
              </div>
              <div id="productList">Loading...</div>
            </div>
          </div>
        </div>
      </div>

      <!-- ============ ANALYTICS PANEL ============ -->
      <div id="analyticsPanel" class="hidden">
        <div class="section-head" style="margin-top:0;"><h2>Users</h2><span>real time + total</span></div>
        <div id="usersBody"><div class="card an-empty">Loading...</div></div>

        <div class="section-head"><h2>Clicks</h2><span>affiliate clicks</span></div>
        <div class="an-toolbar">
          <button type="button" class="range-btn" data-range="7">7 din</button>
          <button type="button" class="range-btn active" data-range="30">30 din</button>
          <button type="button" class="range-btn" data-range="90">90 din</button>
          <button type="button" class="secondary refresh-btn" id="refreshBtn" aria-label="Refresh">↻</button>
        </div>
        <div id="analyticsBody"><div class="card an-empty">Loading...</div></div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gqnwinkddckytrfpnhng.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_NYb3HMwKyHL1YxlOIWtcQg_NGJwDwmQ';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const $ = (id) => document.getElementById(id);
    let currentUser = null;
    let adminShown = false;

    // Everything that comes from the database or from visitors goes through esc()
    // before it touches innerHTML.
    function esc(value) {
      return String(value === null || value === undefined ? '' : value).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function fmt(n) { return Number(n || 0).toLocaleString('en-IN'); }

    // =========================================================
    // AUTH
    // =========================================================
    async function checkSession() {
      const { data } = await sb.auth.getSession();
      if (data.session) {
        currentUser = data.session.user;
        await enterAdmin();
      } else {
        showLogin();
      }
    }

    function showLogin(message) {
      stopLive();
      adminShown = false;
      $('loginView').classList.remove('hidden');
      $('adminView').classList.add('hidden');
      $('loginStatus').className = message ? 'msg-err' : '';
      $('loginStatus').textContent = message || '';
      $('loginBtn').disabled = false;
    }

    // Only users listed in the admins table get in. Anyone else who happens to
    // be signed in (e.g. a normal Google user opening /admin.html) is told so.
    async function enterAdmin() {
      const { data: ok, error } = await sb.rpc('is_admin');
      if (error || ok !== true) {
        await sb.auth.signOut();
        showLogin('Ye account admin nahi hai. Admin email se login karo.');
        return;
      }
      if (adminShown) return;
      adminShown = true;
      $('loginView').classList.add('hidden');
      $('adminView').classList.remove('hidden');
      switchTab('products');
      loadProducts();
      startLive();
    }

    $('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = $('loginEmail').value.trim();
      const password = $('loginPassword').value;
      const statusEl = $('loginStatus');
      const btn = $('loginBtn');
      btn.disabled = true;
      statusEl.className = '';
      statusEl.textContent = 'Logging in...';
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        statusEl.className = 'msg-err';
        statusEl.textContent = error.message;
        btn.disabled = false;
        return;
      }
      currentUser = data.user;
      await enterAdmin();
      btn.disabled = false;
    });

    $('pwToggle').addEventListener('click', function () {
      const inp = $('loginPassword');
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      this.textContent = show ? 'Hide' : 'Show';
    });

    $('logoutBtn').addEventListener('click', async function () {
      await sb.auth.signOut();
      showLogin();
    });

    // If the session expires / is revoked while the panel is open, go back to login.
    sb.auth.onAuthStateChange(function (event) {
      if (event === 'SIGNED_OUT' && adminShown) showLogin();
    });

    // =========================================================
    // TABS
    // =========================================================
    function switchTab(name) {
      const isAnalytics = name === 'analytics';
      $('productsPanel').classList.toggle('hidden', isAnalytics);
      $('analyticsPanel').classList.toggle('hidden', !isAnalytics);
      $('tabProducts').classList.toggle('active', !isAnalytics);
      $('tabAnalytics').classList.toggle('active', isAnalytics);
      if (isAnalytics) { loadUsers(); loadAnalytics(); }
    }
    $('tabProducts').addEventListener('click', function () { switchTab('products'); });
    $('tabAnalytics').addEventListener('click', function () { switchTab('analytics'); });

    // =========================================================
    // LIVE VISITORS (Supabase Realtime presence)
    // The public site (presence.js) joins the "site-presence" channel with a
    // random per-tab id while a tab is open and visible. This panel only
    // listens: it counts those ids and groups them by page. Nothing is stored.
    // =========================================================
    let liveChannel = null;
    let liveState = { count: 0, pages: {}, ok: false };

    function startLive() {
      stopLive();
      try {
        liveChannel = sb.channel('site-presence', { config: { presence: { key: 'admin-' + Math.random().toString(36).slice(2, 8) } } });
        liveChannel
          .on('presence', { event: 'sync' }, recomputeLive)
          .subscribe(function (status) {
            liveState.ok = (status === 'SUBSCRIBED');
            if (status === 'SUBSCRIBED') recomputeLive();
            else renderLive();
          });
      } catch (e) {
        liveState.ok = false;
        renderLive();
      }
    }

    function stopLive() {
      if (liveChannel) { try { sb.removeChannel(liveChannel); } catch (e) {} }
      liveChannel = null;
      liveState = { count: 0, pages: {}, ok: false };
    }

    function recomputeLive() {
      if (!liveChannel) return;
      const state = liveChannel.presenceState();
      let count = 0;
      const pages = {};
      Object.keys(state).forEach(function (key) {
        if (key.indexOf('admin-') === 0) return; // never count admin tabs
        const metas = state[key] || [];
        if (!metas.length) return;
        count += 1;
        const p = String((metas[metas.length - 1] || {}).p || 'index');
        pages[p] = (pages[p] || 0) + 1;
      });
      liveState.count = count;
      liveState.pages = pages;
      renderLive();
    }

    function renderLive() {
      $('liveNumTop').textContent = liveState.ok ? String(liveState.count) : '–';
      $('liveDotTop').classList.toggle('on', liveState.ok);
      const card = $('liveCard');
      if (!card) return;
      card.querySelector('.live-num').textContent = liveState.ok ? String(liveState.count) : '–';
      card.querySelector('.dot').classList.toggle('on', liveState.ok);
      card.querySelector('.lbl-text').textContent = liveState.ok ? 'abhi site pe active' : 'live data connect nahi hua';
      const list = Object.keys(liveState.pages)
        .sort(function (a, b) { return liveState.pages[b] - liveState.pages[a]; })
        .slice(0, 6)
        .map(function (p) { return '<span><b>' + esc(p) + '</b> ' + liveState.pages[p] + '</span>'; })
        .join('');
      card.querySelector('.live-pages').innerHTML = liveState.ok
        ? (list || '<span>Abhi koi visitor nahi</span>')
        : '<span>Realtime check kar: Supabase → Realtime enabled hai ya nahi.</span>';
    }

    // =========================================================
    // USERS (total + signups) — admin_user_stats() RPC, admin-only
    // =========================================================
    function istToday() { return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' }); }
    function lastDays(n) {
      const parts = istToday().split('-').map(Number);
      const base = Date.UTC(parts[0], parts[1] - 1, parts[2]);
      const out = [];
      for (let i = n - 1; i >= 0; i--) out.push(new Date(base - i * 86400000).toISOString().slice(0, 10));
      return out;
    }
    function dayLabel(key) {
      return new Date(key + 'T00:00:00Z').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', timeZone: 'UTC' });
    }
    function timeAgo(iso) {
      const s = Math.max(1, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
      if (s < 3600) return Math.max(1, Math.round(s / 60)) + ' min pehle';
      if (s < 86400) return Math.round(s / 3600) + ' ghante pehle';
      return Math.round(s / 86400) + ' din pehle';
    }

    function barsHtml(keys, byDay, unit) {
      const vals = keys.map(function (k) { return byDay[k] || 0; });
      const max = Math.max.apply(null, vals.concat([1]));
      let peak = 0;
      vals.forEach(function (v, i) { if (v > vals[peak]) peak = i; });
      const bars = vals.map(function (v, i) {
        const h = v === 0 ? 2 : Math.max(4, Math.round((v / max) * 100));
        return '<div class="bar' + (v === 0 ? ' zero' : '') + '" style="height:' + h + '%" title="' + esc(dayLabel(keys[i])) + ': ' + v + '"></div>';
      }).join('');
      return {
        html: '<div class="chart">' + bars + '</div>' +
          '<div class="chart-axis"><span>' + esc(dayLabel(keys[0])) + '</span><span>' + esc(dayLabel(keys[keys.length - 1])) + '</span></div>',
        peakLabel: dayLabel(keys[peak]), peakVal: vals[peak]
      };
    }

    async function loadUsers() {
      const body = $('usersBody');
      body.innerHTML = '<div class="card an-empty">Loading...</div>';
      const { data, error } = await sb.rpc('admin_user_stats');
      if (error) {
        body.innerHTML = '<div class="card"><p class="an-error">Users load nahi ho paaye: ' + esc(error.message) + '</p>' +
          '<p class="an-note">Check kar: admin_user_stats function bana hai ya nahi, aur tu admin account se logged in hai ya nahi.</p></div>';
        return;
      }
      const u = data || {};
      const keys = lastDays(30);
      const byDay = {};
      (u.daily || []).forEach(function (d) { byDay[d.day] = Number(d.signups || 0); });
      const chart = barsHtml(keys, byDay);
      const recent = (u.recent || []).map(function (r) {
        return '<div class="user-row"><span>' + esc(r.name) + (r.username ? ' <span style="color:var(--muted)">@' + esc(r.username) + '</span>' : '') + '</span><span>' + esc(timeAgo(r.created_at)) + '</span></div>';
      }).join('') || '<p class="an-note" style="margin:0;">Abhi koi user nahi.</p>';

      body.innerHTML =
        '<div class="card live-card" id="liveCard">' +
          '<div class="live-num">–</div>' +
          '<div class="live-meta"><div class="lbl"><span class="dot"></span><span class="lbl-text">abhi site pe active</span></div>' +
          '<div class="live-pages"></div></div>' +
        '</div>' +
        '<div class="stat-grid">' +
          '<div class="stat-box"><b>' + fmt(u.total) + '</b><span>Total users</span></div>' +
          '<div class="stat-box"><b>' + fmt(u.today) + '</b><span>Aaj naye</span></div>' +
          '<div class="stat-box"><b>' + fmt(u.last7) + '</b><span>7 din me naye</span></div>' +
          '<div class="stat-box"><b>' + fmt(u.last30) + '</b><span>30 din me naye</span></div>' +
        '</div>' +
        '<div class="card"><p class="card-title">Naye signups <small>last 30 din</small></p>' + chart.html +
          '<p class="chart-peak">Best din: <b>' + esc(chart.peakLabel) + '</b> (' + fmt(chart.peakVal) + ' signups)</p></div>' +
        '<div class="card"><p class="card-title">Latest users</p>' + recent + '</div>' +
        '<p class="an-note" style="margin-top:0;">"Active" = abhi khuli aur dikh rahi tabs (presence.js wale pages pe). Tab background me ya band hote hi count se hat jaata hai.</p>';
      renderLive();
    }

    // =========================================================
    // PRODUCTS
    // =========================================================
    let productsCache = [];
    let productFilter = 'all';

    function currentScoreInputs() {
      return { design: $('sDesign').value, value: $('sValue').value, usefulness: $('sUsefulness').value, aesthetic: $('sAesthetic').value };
    }

    function updateScoreAvgPreview() {
      const s = currentScoreInputs();
      const vals = [s.design, s.value, s.usefulness, s.aesthetic];
      const filled = vals.filter(function (v) { return v !== '' && v !== null; });
      const el = $('scoreAvgPreview');
      if (filled.length === 0) { el.textContent = '— (no score, badge hidden)'; return; }
      const nums = filled.map(Number);
      const avg = nums.reduce(function (a, b) { return a + b; }, 0) / nums.length;
      el.textContent = avg.toFixed(1) + (filled.length < 4 ? ' (sirf ' + filled.length + '/4 bhare)' : '');
    }
    ['sDesign', 'sValue', 'sUsefulness', 'sAesthetic'].forEach(function (id) { $(id).addEventListener('input', updateScoreAvgPreview); });

    function setStatus(text, kind) {
      const el = $('status');
      el.textContent = text || '';
      el.className = kind === 'ok' ? 'msg-ok' : (kind === 'err' ? 'msg-err' : '');
    }

    function resetForm() {
      $('editId').value = '';
      $('pTitle').value = '';
      $('pDescription').value = '';
      $('pLink').value = '';
      $('pCategory').value = 'desk-setup';
      $('pRegion').value = 'india';
      $('pImageFile').value = '';
      $('pImageUrl').value = '';
      $('pActive').checked = true;
      $('imagePreview').classList.add('hidden');
      ['sDesign', 'sValue', 'sUsefulness', 'sAesthetic'].forEach(function (id) { $(id).value = ''; });
      $('pEditorNote').value = '';
      updateScoreAvgPreview();
      $('formTitle').textContent = 'Add Product';
      $('cancelEditBtn').style.display = 'none';
      $('saveBtn').textContent = 'Save Product';
    }
    $('cancelEditBtn').addEventListener('click', function () { resetForm(); setStatus(''); });

    async function saveProduct() {
      const editId = $('editId').value;
      const title = $('pTitle').value.trim();
      const description = $('pDescription').value.trim();
      const affiliate_link = $('pLink').value.trim();
      const category = $('pCategory').value;
      const region = $('pRegion').value;
      const active = $('pActive').checked;
      const fileInput = $('pImageFile');
      let image_url = $('pImageUrl').value;

      if (!title || !affiliate_link) { setStatus('Title aur affiliate link zaroori hain.', 'err'); return; }

      const btn = $('saveBtn');
      btn.disabled = true;
      setStatus('Saving...');

      try {
        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          const fileName = Date.now() + '-' + file.name.replace(/[^a-zA-Z0-9.]/g, '');
          const up = await sb.storage.from('product-images').upload(fileName, file);
          if (up.error) { setStatus('Image upload failed: ' + up.error.message, 'err'); return; }
          image_url = sb.storage.from('product-images').getPublicUrl(fileName).data.publicUrl;
        }

        // Spoider Score is saved only if ALL four sub-scores are filled. A partial
        // score is treated as no score, so a half-filled form can't publish a
        // misleading number.
        const s = currentScoreInputs();
        const raw = [s.design, s.value, s.usefulness, s.aesthetic];
        const allFilled = raw.every(function (v) { return v !== '' && v !== null; });
        let score_design = null, score_value = null, score_usefulness = null, score_aesthetic = null, spoider_score = null;
        if (allFilled) {
          score_design = Number(s.design);
          score_value = Number(s.value);
          score_usefulness = Number(s.usefulness);
          score_aesthetic = Number(s.aesthetic);
          spoider_score = Math.round(((score_design + score_value + score_usefulness + score_aesthetic) / 4) * 10) / 10;
        }
        const editor_note = $('pEditorNote').value.trim() || null;

        const payload = {
          title, description, affiliate_link, category, region, active, image_url,
          score_design, score_value, score_usefulness, score_aesthetic, spoider_score, editor_note
        };

        const result = editId
          ? await sb.from('products').update(payload).eq('id', editId)
          : await sb.from('products').insert(payload);

        if (result.error) { setStatus('Error: ' + result.error.message, 'err'); return; }

        resetForm();
        setStatus('Saved successfully!', 'ok');
        loadProducts();
      } finally {
        btn.disabled = false;
      }
    }
    $('saveBtn').addEventListener('click', saveProduct);

    function renderProducts() {
      const listEl = $('productList');
      const q = $('pSearch').value.trim().toLowerCase();
      const rows = productsCache.filter(function (p) {
        if (productFilter === 'india' && p.region !== 'india') return false;
        if (productFilter === 'us' && p.region !== 'us') return false;
        if (productFilter === 'hidden' && p.active) return false;
        if (q && String(p.title || '').toLowerCase().indexOf(q) === -1) return false;
        return true;
      });
      $('productCount').textContent = rows.length + ' / ' + productsCache.length;
      if (!productsCache.length) { listEl.textContent = 'No products yet.'; return; }
      if (!rows.length) { listEl.textContent = 'Koi product match nahi hua.'; return; }
      listEl.innerHTML = rows.map(function (p) {
        const chip = (p.spoider_score !== null && p.spoider_score !== undefined)
          ? '<span class="score-chip">★ ' + Number(p.spoider_score).toFixed(1) + '</span>' : '';
        return '<div class="product-row" data-id="' + esc(p.id) + '">' +
          '<img src="' + esc(p.image_url || '') + '" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">' +
          '<div class="product-info">' +
            '<strong>' + esc(p.title) + (!p.active ? '<span class="badge-hidden">(hidden)</span>' : '') + '</strong>' +
            '<span>' + esc(p.category) + ' · ' + esc(p.region) + '</span>' + chip +
          '</div>' +
          '<div class="row-actions">' +
            '<button type="button" class="secondary" data-act="edit">Edit</button>' +
            '<button type="button" class="danger" data-act="del">Del</button>' +
          '</div></div>';
      }).join('');
    }

    async function loadProducts() {
      const listEl = $('productList');
      listEl.textContent = 'Loading...';
      const { data, error } = await sb.from('products').select('*').order('created_at', { ascending: false });
      if (error) { listEl.textContent = 'Error loading products: ' + error.message; return; }
      productsCache = data || [];
      renderProducts();
    }

    function editProduct(p) {
      $('editId').value = p.id;
      $('pTitle').value = p.title || '';
      $('pDescription').value = p.description || '';
      $('pLink').value = p.affiliate_link || '';
      $('pCategory').value = p.category || 'desk-setup';
      $('pRegion').value = p.region || 'india';
      $('pImageFile').value = '';
      $('pImageUrl').value = p.image_url || '';
      $('pActive').checked = !!p.active;
      const n = function (v) { return (v !== null && v !== undefined) ? v : ''; };
      $('sDesign').value = n(p.score_design);
      $('sValue').value = n(p.score_value);
      $('sUsefulness').value = n(p.score_usefulness);
      $('sAesthetic').value = n(p.score_aesthetic);
      $('pEditorNote').value = p.editor_note || '';
      updateScoreAvgPreview();
      const preview = $('imagePreview');
      if (p.image_url) { preview.src = p.image_url; preview.classList.remove('hidden'); }
      else preview.classList.add('hidden');
      $('formTitle').textContent = 'Edit Product';
      $('saveBtn').textContent = 'Update Product';
      $('cancelEditBtn').style.display = 'block';
      setStatus('');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteProduct(id) {
      if (!confirm('Delete this product?')) return;
      const { error } = await sb.from('products').delete().eq('id', id);
      if (error) { alert('Error: ' + error.message); return; }
      loadProducts();
    }

    $('productList').addEventListener('click', function (e) {
      const btn = e.target.closest('button[data-act]');
      if (!btn) return;
      const row = btn.closest('.product-row');
      const id = row && row.getAttribute('data-id');
      const p = productsCache.find(function (x) { return String(x.id) === String(id); });
      if (!p) return;
      if (btn.getAttribute('data-act') === 'edit') editProduct(p);
      else deleteProduct(p.id);
    });

    $('pSearch').addEventListener('input', renderProducts);
    document.querySelectorAll('.filters .chip').forEach(function (c) {
      c.addEventListener('click', function () {
        productFilter = c.getAttribute('data-f');
        document.querySelectorAll('.filters .chip').forEach(function (x) { x.classList.toggle('active', x === c); });
        renderProducts();
      });
    });

    // =========================================================
    // ANALYTICS — affiliate click dashboard (click_stats(days) RPC, IST days)
    // The clicks table accepts inserts from anyone, so product_title / page are
    // untrusted input: everything rendered goes through esc().
    // =========================================================
    let analyticsRange = 30;
    let analyticsToken = 0;

    function sumLastDays(daily, n) {
      const wanted = {};
      lastDays(n).forEach(function (k) { wanted[k] = true; });
      return (daily || []).reduce(function (sum, d) { return wanted[d.day] ? sum + Number(d.clicks || 0) : sum; }, 0);
    }
    function prettyPage(path) {
      const seg = String(path || '').split('/').filter(Boolean).pop() || 'home';
      const name = seg.replace(/\.html$/i, '');
      return (!name || name === 'index') ? 'home' : name;
    }

    document.querySelectorAll('.an-toolbar .range-btn').forEach(function (b) {
      b.addEventListener('click', function () {
        analyticsRange = Number(b.getAttribute('data-range'));
        document.querySelectorAll('.an-toolbar .range-btn').forEach(function (x) { x.classList.toggle('active', x === b); });
        loadAnalytics();
      });
    });
    $('refreshBtn').addEventListener('click', function () { loadUsers(); loadAnalytics(); });

    async function loadAnalytics() {
      const body = $('analyticsBody');
      const token = ++analyticsToken;
      body.innerHTML = '<div class="card an-empty">Loading...</div>';
      try {
        const widePromise = sb.rpc('click_stats', { days: 90 });
        const rangePromise = analyticsRange === 90 ? widePromise : sb.rpc('click_stats', { days: analyticsRange });
        const results = await Promise.all([widePromise, rangePromise]);
        if (token !== analyticsToken) return;
        const wide = results[0], sel = results[1];
        if (wide.error) throw wide.error;
        if (sel.error) throw sel.error;
        renderAnalytics(wide.data, sel.data);
      } catch (err) {
        if (token !== analyticsToken) return;
        body.innerHTML = '<div class="card"><p class="an-error">Analytics load nahi ho paaye: ' + esc(err && err.message ? err.message : err) + '</p>' +
          '<p class="an-note">Check kar: click_stats function aur SELECT policy wala SQL run hua ya nahi, aur tu logged in hai ya nahi.</p></div>';
      }
    }

    function renderAnalytics(wide, sel) {
      const body = $('analyticsBody');
      wide = wide || {}; sel = sel || {};
      if (!Number(wide.total)) {
        body.innerHTML = '<div class="card an-empty">Abhi koi clicks record nahi hue.<br>Site pe kisi product card pe tap kar ke test kar, phir ↻ dabao.</div>';
        return;
      }
      const daily = wide.daily || [];
      const cards =
        '<div class="stat-grid three">' +
          '<div class="stat-box"><b>' + fmt(wide.today) + '</b><span>Aaj</span></div>' +
          '<div class="stat-box"><b>' + fmt(sumLastDays(daily, 7)) + '</b><span>7 din</span></div>' +
          '<div class="stat-box"><b>' + fmt(sumLastDays(daily, 30)) + '</b><span>30 din</span></div>' +
        '</div>';

      const keys = lastDays(analyticsRange);
      const byDay = {};
      (sel.daily || []).forEach(function (d) { byDay[d.day] = Number(d.clicks || 0); });
      const ch = barsHtml(keys, byDay);
      const chart = '<div class="card"><p class="card-title">Daily clicks <small>last ' + analyticsRange + ' din</small></p>' + ch.html +
        '<p class="chart-peak">Best din: <b>' + esc(ch.peakLabel) + '</b> (' + fmt(ch.peakVal) + ' clicks) · Total: <b>' + fmt(sel.total) + '</b></p></div>';

      const rank = function (items, labelFn, valKey) {
        if (!items.length) return '<p class="an-note" style="margin:0;">Is range mein koi data nahi.</p>';
        const max = Number(items[0][valKey]) || 1;
        return items.map(function (p) {
          const pct = Math.max(3, Math.round((Number(p[valKey]) / max) * 100));
          return '<div class="rank-row"><div class="rank-head"><span class="rank-title">' + esc(labelFn(p)) + '</span><span class="rank-count">' + fmt(p[valKey]) + '</span></div>' +
                 '<div class="rank-track"><div class="rank-fill" style="width:' + pct + '%"></div></div></div>';
        }).join('');
      };
      const topCard = '<div class="card"><p class="card-title">Top products <small>title ke hisaab se</small></p>' + rank(sel.top_products || [], function (p) { return p.title; }, 'clicks') + '</div>';

      const reg = sel.by_region || {};
      const us = Number(reg.us || 0), ind = Number(reg['in'] || 0), unk = Number(reg.unknown || 0);
      const regTotal = us + ind + unk;
      const pctOf = function (n) { return regTotal ? (n / regTotal) * 100 : 0; };
      const regionCard =
        '<div class="card"><p class="card-title">US vs India</p>' +
          '<div class="region-bar">' +
            '<div class="region-seg-us" style="width:' + pctOf(us).toFixed(1) + '%"></div>' +
            '<div class="region-seg-in" style="width:' + pctOf(ind).toFixed(1) + '%"></div>' +
            '<div class="region-seg-unk" style="width:' + pctOf(unk).toFixed(1) + '%"></div>' +
          '</div>' +
          '<div class="region-legend">' +
            '<span><i style="background:#c9a876"></i>US <b>' + fmt(us) + '</b> (' + Math.round(pctOf(us)) + '%)</span>' +
            '<span><i style="background:#e8c766"></i>India <b>' + fmt(ind) + '</b> (' + Math.round(pctOf(ind)) + '%)</span>' +
            (unk ? '<span><i style="background:#6b6968"></i>Unknown <b>' + fmt(unk) + '</b></span>' : '') +
          '</div>' +
          '<p class="an-note">Home page (index) ke clicks US mein count hote hain.</p>' +
        '</div>';

      const pagesCard = '<div class="card"><p class="card-title">Top pages <small>kahan se clicks aaye</small></p>' + rank(sel.top_pages || [], function (p) { return prettyPage(p.page); }, 'clicks') + '</div>';

      body.innerHTML = cards + chart + topCard + regionCard + pagesCard +
        '<p class="an-note">Yeh clicks Spoider Finds site ke product cards ke hain, Amazon ke actual sales/earnings nahi. Asli earnings ke liye Amazon Associates dashboard dekh.</p>';
    }

    updateScoreAvgPreview();
    checkSession();
  </script>
</body>
