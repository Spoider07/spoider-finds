<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One-Time Product Migration</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0b;
      color: #f0ece3;
      padding: 1.2rem;
    }
    h1 { font-size: 1.3rem; color: #e8c766; }
    .card {
      background: #16161a;
      border: 1px solid rgba(201,168,118,0.25);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    label { display: block; font-size: 0.85rem; margin: 0.7rem 0 0.3rem; color: #cbc4b6; }
    input {
      width: 100%;
      padding: 0.6rem;
      border-radius: 8px;
      border: 1px solid rgba(201,168,118,0.3);
      background: #0a0a0b;
      color: #f0ece3;
      font-size: 0.95rem;
    }
    button {
      background: #c9a876;
      color: #0a0a0b;
      border: none;
      padding: 0.8rem 1.2rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      margin-top: 1rem;
      cursor: pointer;
      width: 100%;
    }
    button:disabled { opacity: 0.5; }
    #log {
      font-size: 0.85rem;
      margin-top: 1rem;
      white-space: pre-wrap;
      line-height: 1.6;
    }
    .ok { color: #8fd18f; }
    .err { color: #ff8080; }
  </style>
</head>
<body>
  <h1>Migrate US Products → Supabase</h1>
  <div class="card">
    <label>Admin Email</label>
    <input type="email" id="loginEmail" placeholder="you@example.com">
    <label>Password</label>
    <input type="password" id="loginPassword" placeholder="••••••••">
    <button id="loginBtn" onclick="login()">Log in</button>
  </div>

  <div class="card">
    <p>This will insert <strong>11 products</strong> (Desk Setup, Fashion Finds, Accessories, Amazon Finds — region: US) into your Supabase <code>products</code> table. Safe to click only once you're logged in.</p>
    <button id="migrateBtn" onclick="migrate()" disabled>Run Migration</button>
    <div id="log"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gqnwinkddckytrfpnhng.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_NYb3HMwKyHL1YxlOIWtcQg_NGJwDwmQ';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const products = [
      { title: "Levitating Moon Lamp", description: "A 3D-printed galaxy lamp that floats and spins in mid-air — 16 colors, 20 lighting modes.", affiliate_link: "https://amzn.to/4h19PvI", category: "desk-setup", region: "us", active: true, image_url: "assets/images/levitating-moon-lamp.jpg" },
      { title: "Epic Electric Standing Desk", description: "Height-adjustable with memory presets and a spacious top — the upgrade your home office needs.", affiliate_link: "https://amzn.to/3Qx5kyo", category: "desk-setup", region: "us", active: true, image_url: "assets/images/epic-standing-desk.jpg" },
      { title: "Iron Man Arc Reactor Lamp", description: "Marvel-inspired rechargeable LED lamp with touch/remote control — a superhero glow for your desk.", affiliate_link: "https://amzn.to/4beSCex", category: "desk-setup", region: "us", active: true, image_url: "assets/images/92d6b34d824eab71d661b7b6a2be2345.jpg" },
      { title: "Retro PC-Style Bluetooth Speaker", description: "Pixel display with DIY faces, Bluetooth & USB audio, and an alarm clock — retro charm for your setup.", affiliate_link: "https://amzn.to/3To1fNP", category: "desk-setup", region: "us", active: true, image_url: "assets/images/5349fd8153ecf121ee14b136b5a0cc66.jpg" },

      { title: "Monster Graphic Sweatshirt", description: "Oversized quarter-zip pullover with a bold graphic print — trendy streetwear for fall.", affiliate_link: "https://amzn.to/4eR5BWd", category: "fashion-finds", region: "us", active: true, image_url: "assets/images/monster-sweatshirt.jpg" },
      { title: "Japanese Streetwear Hoodie", description: "Hand-illustrated sakura pagoda graphic, oversized fit, premium cotton blend.", affiliate_link: "https://amzn.to/4eIiJwO", category: "fashion-finds", region: "us", active: true, image_url: "assets/images/ddc0b64cc6355f777da2e2085d4f0321.jpg" },
      { title: "Vintage Goth Punk Tee", description: "Acid wash oversized fit with a bold angel-wing cross graphic — grunge streetwear aesthetic.", affiliate_link: "https://amzn.to/3TEpVld", category: "fashion-finds", region: "us", active: true, image_url: "assets/images/c9ef2b0bfa372d26dd302b695ec59ad1.jpg" },

      { title: "Aesthetic Alien Space Wallet", description: "A fun bifold wallet with a cosmic UFO print and built-in card holder.", affiliate_link: "https://amzn.to/4fDBOAr", category: "accessories", region: "us", active: true, image_url: "assets/images/aesthetic-alien-wallet.jpg" },
      { title: "Casio Vintage Digital Watch", description: "Classic retro stainless steel build with LED light, alarm, and 7-year battery life.", affiliate_link: "https://amzn.to/3SBZUTn", category: "accessories", region: "us", active: true, image_url: "assets/images/f566889325db22663b46fa4b393f16d0.jpg" },
      { title: "Maneki Neko Lucky Cat Keychain", description: "A brass Feng Shui good luck charm — a unique daily-carry gift piece.", affiliate_link: "https://amzn.to/4wT5qzK", category: "accessories", region: "us", active: true, image_url: "assets/images/4e1de9bce635fa32e7b2c734f91ed9ba.jpg" },

      { title: "Robotic Charger Block", description: "A 30W GaN fast charger with a playful LED face — genuinely useful and fun on a desk.", affiliate_link: "https://amzn.to/3T87LIA", category: "amazon-finds", region: "us", active: true, image_url: "assets/images/robotic-charger-block.jpg" }
    ];

    async function login() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Logging in...';
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        alert('Login failed: ' + error.message);
        btn.disabled = false;
        btn.textContent = 'Log in';
        return;
      }
      btn.textContent = 'Logged in ✓';
      document.getElementById('migrateBtn').disabled = false;
    }

    async function migrate() {
      const log = document.getElementById('log');
      const btn = document.getElementById('migrateBtn');
      btn.disabled = true;
      btn.textContent = 'Running...';
      log.innerHTML = 'Inserting ' + products.length + ' products...\n';

      const { data, error } = await sb.from('products').insert(products).select();

      if (error) {
        log.innerHTML += '<span class="err">Error: ' + error.message + '</span>';
        btn.disabled = false;
        btn.textContent = 'Run Migration';
        return;
      }

      log.innerHTML += '<span class="ok">✓ Done! ' + data.length + ' products inserted successfully.</span>\n\nYou can now delete this migrate.html file and go check admin.html to confirm.';
      btn.textContent = 'Migration Complete ✓';
    }
  </script>
</body>
</html>
